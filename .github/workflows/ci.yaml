name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    # Windows is being brought up: its failures are reported but do not fail
    # the run until it is green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    defaults:
      run:
        shell: bash

    steps:
      # Test data and goldens are compared byte for byte.
      - name: Check out line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5
          dune-cache: true

      - name: Install OCaml dependencies
        id: deps
        run: |
          # opam does not read the pins in dune-project; pin the same commits.
          awk -F'"' '/"git\+/ { url = $2 } url && /\(name / { sub(/.*\(name /, ""); sub(/\).*/, ""); print $0, url; url = "" }' dune-project |
            while read -r name url; do opam pin add -n "$name" "$url"; done
          opam install . --deps-only --with-test

      - name: Build install targets
        run: opam exec -- dune build @install

      # Each package's tests run even when another's fail.
      - name: Build and test matrix
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          opam exec -- dune build matrix
          opam exec -- dune build @matrix/runtest

      - name: Build and test toffee
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          opam exec -- dune build toffee
          opam exec -- dune build @toffee/runtest

      - name: Build and test mosaic
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          opam exec -- dune build mosaic
          opam exec -- dune build @mosaic/runtest
