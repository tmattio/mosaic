name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # Fails building tsdl
          # - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5
          dune-cache: true

      - name: Install OCaml dependencies
        run: |
          # opam does not read the pins in dune-project. The benchmarks and
          # tests follow thumper and windtrap as of 0d42dc69 and 31121058.
          opam pin add -n thumper git+https://github.com/invariant-hq/thumper.git#0d42dc6964e30525b0595b6d5be04a1eda76c90e
          opam pin add -n windtrap git+https://github.com/invariant-hq/windtrap.git#31121058567da1edb72603f42514eb1276ca37cc
          opam pin add -n ppx_windtrap git+https://github.com/invariant-hq/windtrap.git#31121058567da1edb72603f42514eb1276ca37cc
          opam install . --deps-only --with-test
          # For matrix's terminal emulator demo
          opam install tsdl tsdl-ttf

      - name: Build install targets
        run: opam exec -- dune build @install

      - name: Build and test matrix
        run: |
          opam exec -- dune build matrix
          opam exec -- dune build @matrix/runtest

      - name: Build and test toffee
        run: |
          opam exec -- dune build toffee
          opam exec -- dune build @toffee/runtest

      - name: Build and test tree-sitter
        run: |
          opam exec -- dune build tree-sitter
          opam exec -- dune build @tree-sitter/runtest

      - name: Build and test matrix-eio
        run: |
          opam exec -- dune build matrix-eio
          opam exec -- dune build @matrix-eio/runtest

      - name: Build and test mosaic
        run: |
          opam exec -- dune build mosaic
          opam exec -- dune build @mosaic/runtest
